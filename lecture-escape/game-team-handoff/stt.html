<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LecScape STT 분석</title>
    <link rel="stylesheet" href="/game-team-handoff/integration/style.css">
  </head>
  <body>
    <main class="shell stt-shell">
      <p class="eyebrow">LIVE LECTURE ANALYSIS</p>
      <h1>강의를 듣고<br><span>탈출 게임으로 변환합니다.</span></h1>
      <p class="intro">STT 변환과 개념 분석 결과를 확인한 뒤 생성된 방탈출 게임을 시작하세요.</p>

      <section class="control-card stt-status-card" aria-labelledby="stt-title">
        <div>
          <p class="label">STT STATUS</p>
          <h2 id="stt-title">샘플 강의 분석 준비 중</h2>
          <p id="stt-summary">게임 생성 데이터를 불러오고 있습니다.</p>
        </div>
        <div class="stt-progress" aria-hidden="true"><span id="stt-progress-bar"></span></div>
      </section>

      <section class="analysis-card" aria-labelledby="concept-title">
        <p class="label">CORE CONCEPTS</p>
        <h2 id="concept-title">분석된 핵심 개념</h2>
        <div id="concept-list" class="stt-concept-list"></div>
      </section>

      <p id="stt-error" class="integration-notice" role="alert" hidden></p>
      <button id="start-game" class="primary-link stt-start-button" type="button" disabled>
        게임 시작
      </button>
    </main>
    <script type="module" src="/game-team-handoff/stt.js"></script>
  </body>
</html>
